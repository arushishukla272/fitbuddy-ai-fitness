<!DOCTYPE html>
<html>
<head><title>Your Plan</title></head>
<body style="font-family: Arial; padding: 20px;">
    <h1>Hi {{ user }}, Your AI Plan is Ready!</h1>
    
    <p><b>Name:</b> {{ name }} | <b>Gender:</b> {{ gender }} | <b>Goal:</b> {{ goal }}</p>
    <p><b>BMI:</b> {{ bmi }} | <b>Activity:</b> {{ activity }} | <b>Diet:</b> {{ diet }} | <b>Days:</b> {{ days }}/week</p>
    <p><b>Health:</b> {{ health }}</p>

    <hr>
    <h3>Your Full Plan:</h3>
    <div style="white-space: pre-line; background: #f5f5f5; padding: 15px; border-radius: 10px;">
        {{ plan }}
    </div>

    <br>
    <a href="/">Back to Home</a>
</body>
</html>
